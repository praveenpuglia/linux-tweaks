# Espanso settings: https://espanso.org/docs/configuration/
# No pop-up notifications when Espanso starts or reloads.
show_notifications: false

# KDE Wayland layout auto-detection fails; set it explicitly.
keyboard_layout:
  layout: "us"

# Alt+Space opens Espanso search by default; leave it to KRunner.
search_shortcut: off
